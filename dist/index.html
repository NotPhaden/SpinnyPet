<!doctype html>
<html lang="en">
  <head>
    <script>
      (function(){
        var key="_spinnyReloadCount", max=3;
        window.addEventListener("error",function(e){
          var t=e.target;
          if(!(t&&(t.tagName==="SCRIPT"||t.tagName==="LINK"))) return;
          var u=t.src||t.href||"";
          if(u.indexOf("/assets/")===-1) return;
          var c=parseInt(sessionStorage.getItem(key)||"0",10);
          if(c>=max) return;
          sessionStorage.setItem(key,String(c+1));
          setTimeout(function(){ location.href=location.pathname+location.search.replace(/[?&]_r=\d+/,"")+(location.search?"&":"?")+"_r="+Date.now(); },c*900);
        },true);
        window.addEventListener("load",function(){sessionStorage.removeItem(key)});
      })();
    </script>
